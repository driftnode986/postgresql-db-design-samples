# 本書の実行環境。PostgreSQL は 18.6 に固定する。
#
# postgres:18 のようなメジャー版だけのタグは、取得した時期で中身が変わる
# （18.4 が入っていた例がある）。本書の実行計画と測定値は 18.6 で取ったものなので、
# マイナー版まで書く。
services:
  db:
    image: postgres:18.6
    container_name: pgdbdesign
    environment:
      POSTGRES_USER: book_admin        # 初期化だけに使うスーパーユーザー。測定には使わない
      POSTGRES_PASSWORD: book_admin    # ローカルの学習用。外部に公開するサーバーでは使わない
      POSTGRES_DB: book
    ports:
      - "127.0.0.1:55432:5432"         # 自分のマシンからだけ接続できる
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro   # book_owner / book_app の作成と拡張
      - pgdata:/var/lib/postgresql              # 18 のイメージはこの階層をボリュームにする
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "book_admin", "-d", "book"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
